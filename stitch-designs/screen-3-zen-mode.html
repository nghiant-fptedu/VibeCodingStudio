<style>
    /* Equalizer animation for the sound status */
    @keyframes eq-wave-1 { 0%, 100% { height: 4px; } 50% { height: 14px; } }
    @keyframes eq-wave-2 { 0%, 100% { height: 12px; } 50% { height: 6px; } }
    @keyframes eq-wave-3 { 0%, 100% { height: 6px; } 50% { height: 16px; } }
    @keyframes eq-wave-4 { 0%, 100% { height: 10px; } 50% { height: 4px; } }

    .eq-bar-1 { animation: eq-wave-1 1.2s ease-in-out infinite; }
    .eq-bar-2 { animation: eq-wave-2 0.9s ease-in-out infinite 0.2s; }
    .eq-bar-3 { animation: eq-wave-3 1.4s ease-in-out infinite 0.1s; }
    .eq-bar-4 { animation: eq-wave-4 1.1s ease-in-out infinite 0.3s; }

    /* Custom Ambient Glow */

      box-shadow: 0 0 45px -5px rgba(245, 158, 11, 0.18), inset 0 0 25px 0 rgba(245, 158, 11, 0.05);
    }
    .text-glow {
      text-shadow: 0 0 24px rgba(255, 193, 116, 0.45);

<body class="bg-background text-on-surface m-0 p-0 overflow-hidden select-none font-body-md relative h-screen w-screen flex flex-col justify-between items-center">

<!-- Subtle moody gradient overlay for focus comfort & ambient depth -->
<div class="absolute inset-0 bg-gradient-to-b from-surface-container-lowest/70 via-background/60 to-surface-container-lowest/85 backdrop-blur-[2px]"></div>
<!-- Radial Vignette for immersion -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_30%,#060e20_95%)] opacity-80"></div>
</div>
<!-- Top-Right Corner: Subtle Exit Zen Mode Floating Pill -->
<header class="relative z-30 w-full flex justify-end items-center px-margin py-space-lg">
<a aria-label="Exit Zen Mode" class="group flex items-center gap-space-sm px-space-md py-space-sm rounded-full bg-surface-container-lowest/40 hover:bg-surface-container-high/60 border border-outline-variant/30 hover:border-primary/40 backdrop-blur-xl shadow-2xl transition-all duration-300 text-on-surface-variant hover:text-primary active:scale-95" href="#" role="button">
<span class="material-symbols-outlined text-[18px] transition-transform duration-300 group-hover:rotate-90">fullscreen_exit</span>
<span class="font-label-md text-label-md tracking-wider">Exit Zen</span>
</a>
</header>
<!-- Central Hero: Minimalist Frosted Glass Pomodoro Timer -->
<main class="relative z-30 flex flex-col items-center justify-center -mt-6">
<div class="timer-glow relative flex flex-col items-center justify-center p-space-xl rounded-xl bg-surface-container-low/55 backdrop-blur-2xl border border-outline-variant/30 max-w-[420px] w-[90vw] transition-all duration-500">
<!-- Minimalist Mode Pill: Focus Session -->
<div class="flex items-center gap-space-sm px-space-md py-1.5 rounded-full bg-surface-container-highest/40 border border-outline-variant/30 mb-space-lg">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tertiary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-tertiary"></span>
</span>
<span class="font-label-md text-label-md text-tertiary tracking-wide uppercase">Focus Session</span>
</div>
<!-- Circular Progress Ring & High-Contrast Tabular Timer Readout -->
<div class="relative w-72 h-72 flex items-center justify-center my-space-xs">
<!-- SVG Ring -->
<svg class="w-full h-full -rotate-90 transform drop-shadow-lg" viewbox="0 0 240 240">
<defs>
<lineargradient id="zenProgressGradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#ffc174"></stop>
<stop offset="60%" stop-color="#f59e0b"></stop>
<stop offset="100%" stop-color="#57e1ce"></stop>
</lineargradient>
<filter height="140%" id="softGlow" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="4"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
</filter>
</defs>
<!-- Background Track -->
<circle class="text-surface-variant/40" cx="120" cy="120" fill="none" r="102" stroke="currentColor" stroke-width="5"></circle>
<!-- Glowing Progress Indicator (e.g., ~78% remaining) -->
<circle class="transition-all duration-1000 ease-out" cx="120" cy="120" fill="none" filter="url(#softGlow)" r="102" stroke="url(#zenProgressGradient)" stroke-dasharray="640.88" stroke-dashoffset="142" stroke-linecap="round" stroke-width="5"></circle>
</svg>

<span class="font-display-timer text-display-timer text-primary tracking-tight tabular-nums text-glow select-none" id="timerReadout">

<span class="material-symbols-outlined text-[20px]">refresh</span>

<button aria-label="Pause timer" class="w-14 h-14 rounded-full flex items-center justify-center bg-gradient-to-br from-primary-container to-primary text-on-primary font-bold shadow-lg shadow-primary-container/30 border border-white/30 hover:brightness-110 active:scale-95 transition-all duration-200" id="btnToggle" title="Pause timer">

<div class="flex items-center gap-1.5 ml-1">

<span class="w-1.5 h-1.5 rounded-full bg-primary"></span>

<span class="w-0.5 bg-tertiary rounded-full eq-bar-2"></span>
<span class="w-0.5 bg-tertiary rounded-full eq-bar-3"></span>
<span class="w-0.5 bg-tertiary rounded-full eq-bar-4"></span>
</div>
<!-- Audio Track String -->
<span class="font-body-sm text-body-sm tracking-wide select-none">
        ♫ Lofi Girl · Rain &amp; Thunder <span class="text-on-surface-variant/60 font-label-sm ml-0.5">(45%)</span>
</span>
<!-- Mini Volume Icon Indicator -->
<span class="material-symbols-outlined text-[16px] text-tertiary/80 ml-1">volume_up</span>
</div>
</footer>
<!-- Micro-interaction Script for Pause/Play and Timer Ticking -->
<script>
    (function() {
      let isRunning = true;
      let totalSeconds = 24 * 60 + 38;
      const display = document.getElementById('timerReadout');
      const toggleBtn = document.getElementById('btnToggle');
      const toggleIcon = document.getElementById('toggleIcon');
      const resetBtn = document.getElementById('btnReset');

      function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      setInterval(() => {
        if (isRunning && totalSeconds > 0) {
          totalSeconds--;
          display.textContent = formatTime(totalSeconds);
        }
      }, 1000);

      toggleBtn.addEventListener('click', () => {
        isRunning = !isRunning;
        toggleIcon.textContent = isRunning ? 'pause' : 'play_arrow';
      });

      resetBtn.addEventListener('click', () => {
        totalSeconds = 25 * 60;
        display.textContent = formatTime(totalSeconds);
      });
    })();
  </script>
</body></html>
