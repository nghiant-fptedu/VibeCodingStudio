<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- VibeSpace Amber Radiance Gradient -->
    <linearGradient id="vibespace-amber-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="20%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Top Specular Glass Highlight -->
    <linearGradient id="vibespace-specular" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Depth Shadow -->
    <linearGradient id="vibespace-depth" x1="0" y1="64" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#92400e" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#92400e" stop-opacity="0"/>
    </linearGradient>

    <!-- Midnight Slate Icon Gradient -->
    <linearGradient id="vibespace-slate-emblem" x1="16" y1="14" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Soft Radiance -->
  <rect width="64" height="64" rx="16" fill="url(#vibespace-amber-bg)"/>
  
  <!-- Subtle Glass Highlight Rim -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#vibespace-specular)" stroke-width="2"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#vibespace-depth)" stroke-width="2"/>

  <!-- Main 4-Point Sparkles Star (Center Hero Focus) -->
  <path d="M28 14 Q28 34 48 34 Q28 34 28 54 Q28 34 8 34 Q28 34 28 14 Z" fill="url(#vibespace-slate-emblem)"/>

  <!-- Companion Sparkles Star (Top-Right Celestial Accent) -->
  <path d="M48 11 Q48 18 55 18 Q48 18 48 25 Q48 18 41 18 Q48 18 48 11 Z" fill="url(#vibespace-slate-emblem)"/>

  <!-- Micro Orbit Focus Dot (Left Celestial Depth Accent) -->
  <circle cx="15" cy="21" r="2.5" fill="url(#vibespace-slate-emblem)"/>
</svg>